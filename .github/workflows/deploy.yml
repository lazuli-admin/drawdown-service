name: Build and deploy drawdown-service

on:
  push:
    branches: [development]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            # Abort on the first failing command
            set -e

            # Load the Infisical machine identity credentials stored on the droplet
            set -a; . /etc/drawdown/deploy.env; set +a

            # Exchange machine identity creds for a short-lived Infisical access token
            export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" --silent --plain)

            # Pull app secrets from Infisical into an env file (sed strips the single quotes
            # infisical adds, which docker --env-file would pass through literally)
            mkdir -p /opt/drawdown
            infisical export --format=dotenv --projectId=3f4a5caa-157d-4636-a502-990ab9d3a072 --env=prod | sed "s/='\(.*\)'\$/=\1/" > /opt/drawdown/.env

            # Authenticate to GHCR with the workflow's short-lived token and grab the new image
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest

            # Replace the running container (rm is a no-op on first deploy).
            # Log rotation keeps the json log bounded; the memory cap keeps a runaway
            # process from taking the whole box down with it.
            docker rm -f drawdown 2>/dev/null || true
            docker run -d --name drawdown --restart unless-stopped -p 8787:8787 \
              --log-opt max-size=10m --log-opt max-file=3 \
              --memory=300m \
              --env-file /opt/drawdown/.env ghcr.io/${{ github.repository }}:latest

            # Old images stack up per deploy forever without this
            docker image prune -af
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
